AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Incident-diagnosis TEST stack (Internet -> ALB -> ECS Fargate -> RDS PostgreSQL, plus an SQS queue
  drained by a Lambda consumer). For capturing a few real incidents with the fault-injection tool.
  NOT for production. Incurs AWS cost while running (ALB, RDS, Fargate); delete the stack afterwards.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two public subnets in different AZs (Fargate tasks get public IPs).
  AppImage:
    Type: String
    Default: public.ecr.aws/nginx/nginx:stable
    Description: >
      Container image for the web service. To see database-related faults, use an image that
      reads DATABASE_SECRET_ARN / DB_HOST and queries the database on each request.
  DesiredCount:
    Type: Number
    Default: 2
  DBInstanceClass:
    Type: String
    Default: db.t4g.micro

Resources:
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB ingress
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App tasks
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, SourceSecurityGroupId: !Ref AlbSecurityGroup }

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Database ingress (security_group_misconfiguration fault target)
      VpcId: !Ref VpcId

  DbIngressFromApp:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DbSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref AppSecurityGroup

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 80
      TargetType: ip
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - { Type: forward, TargetGroupArn: !Ref TargetGroup }

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: test stack
      SubnetIds: !Ref SubnetIds

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    Properties:
      Engine: postgres
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: "20"
      StorageType: gp3
      MasterUsername: appadmin
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      PubliclyAccessible: false
      BackupRetentionPeriod: 0
      EnablePerformanceInsights: false

  SecretsReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Lets the app read the DB secret (iam_permission_failure fault target)
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !GetAtt Database.MasterUserSecret.SecretArn

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns: [!Ref SecretsReadPolicy]

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings:
        - { Name: containerInsights, Value: enabled }

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: incident-test-web
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: web
          Image: !Ref AppImage
          Essential: true
          PortMappings: [{ ContainerPort: 80 }]
          Environment:
            - { Name: DB_HOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: DATABASE_SECRET_ARN, Value: !GetAtt Database.MasterUserSecret.SecretArn }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AppLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref AppSecurityGroup]
      LoadBalancers:
        - { ContainerName: web, ContainerPort: 80, TargetGroupArn: !Ref TargetGroup }

  JobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 120

  ConsumerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaSQSQueueExecutionRole

  ConsumerFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      MemorySize: 128
      ReservedConcurrentExecutions: 20
      Role: !GetAtt ConsumerRole.Arn
      Code:
        ZipFile: |
          import time
          def handler(event, context):
              for _ in event.get("Records", []):
                  time.sleep(1.0)
              return {"processed": len(event.get("Records", []))}

  ConsumerMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt JobsQueue.Arn
      FunctionName: !Ref ConsumerFunction
      BatchSize: 10

Outputs:
  AlbUrl: { Value: !Sub "http://${LoadBalancer.DNSName}" }
  ListenerArn: { Value: !Ref Listener }
  ClusterName: { Value: !Ref Cluster }
  ServiceName: { Value: !GetAtt Service.Name }
  TaskRoleName: { Value: !Ref TaskRole }
  SecretsPolicyArn: { Value: !Ref SecretsReadPolicy }
  DbInstanceId: { Value: !Ref Database }
  DbHost: { Value: !GetAtt Database.Endpoint.Address }
  DbSecretArn: { Value: !GetAtt Database.MasterUserSecret.SecretArn }
  DbSecurityGroupId: { Value: !Ref DbSecurityGroup }
  AppSecurityGroupId: { Value: !Ref AppSecurityGroup }
  ConsumerFunctionName: { Value: !Ref ConsumerFunction }
  QueueUrl: { Value: !Ref JobsQueue }
