name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (${{ matrix.extras }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # With faiss-cpu (rag extra) and without it: the vector store must fall back to NumPy.
        extras: ["dev,aws,rag", "dev,aws"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[${{ matrix.extras }}]"
      - name: faiss presence matches the matrix entry
        run: |
          python -c "import importlib.util as u, sys; has = u.find_spec('faiss') is not None; want = 'rag' in '${{ matrix.extras }}'; print('faiss installed:', has); sys.exit(0 if has == want else 1)"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  pgvector:
    name: pgvector (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: clouddiag
          POSTGRES_PASSWORD: clouddiag
          POSTGRES_DB: clouddiag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clouddiag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CLOUDDIAG_DATABASE_URL: postgresql+psycopg://clouddiag:clouddiag@localhost:5432/clouddiag
      CLOUDDIAG_TEST_PG_URL: postgresql+psycopg://clouddiag:clouddiag@localhost:5432/clouddiag
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,rag]"
      - run: alembic upgrade head
      - name: live pgvector store test (must run, not skip)
        run: pytest -q -rs tests/test_redaction_rag.py::test_pgvector_store_on_postgres -p no:cacheprovider | tee pg.log && ! grep -q SKIPPED pg.log
      - run: alembic downgrade base
      - run: alembic upgrade head

  frontend:
    name: frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e walk-through (offline data, stub LLM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "./backend[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: generate the offline dataset
        run: python -m app.offline.generate
        working-directory: backend
      - name: walk-through
        run: npx playwright test
        working-directory: frontend
        env:
          E2E_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: frontend/test-results/
          retention-days: 7

  reproducibility:
    name: reproducibility (cited experiment, report ids)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,rag]"
      - name: component report ids match their content
        run: python -m app.evaluation.provenance check
      - name: generate the offline dataset and the historical corpus
        run: python -m app.offline.generate && python -m app.rag.corpus
      - name: the experiment cited in docs/evaluation.md reproduces (results hash)
        run: |
          id=$(grep -oE 'exp-[0-9a-f]{12}' ../docs/evaluation.md | head -1)
          echo "verifying $id"
          python -m app.experiments verify "$id"

  docker:
    name: docker quickstart (fresh build, offline demo diagnosis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: end-to-end check through nginx
        run: python3 scripts/quickstart_check.py --url http://localhost:3000
      - name: production override refuses the demo key
        run: |
          export POSTGRES_PASSWORD=ci-password-0123 CLOUDDIAG_API__API_KEYS='["demo-key-change-me"]'
          docker compose -p prodcheck -f docker-compose.yml -f docker-compose.prod.yml up -d db api || true
          sleep 20
          docker compose -p prodcheck -f docker-compose.yml -f docker-compose.prod.yml logs api | grep -q "demo key is not allowed in production"
          docker compose -p prodcheck -f docker-compose.yml -f docker-compose.prod.yml down -v
      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color
      - run: docker compose down -v
        if: always()
