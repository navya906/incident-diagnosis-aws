# Default configuration. Override any key via env var CLOUDDIAG_<SECTION>__<KEY>,
# e.g. CLOUDDIAG_DATABASE_URL, CLOUDDIAG_EVIDENCE__TOP_K=20.
environment: development
# offline = replay/synthetic data; aws = real AWS telemetry. In aws mode the redaction policy is
# mandatory: external LLM/embedding clients and the capture CLI fail closed if it is weakened.
data_mode: offline              # override with CLOUDDIAG_DATA_MODE=aws for real incidents
log_level: INFO
log_json: false
database_url: postgresql+psycopg://clouddiag:clouddiag@localhost:5432/clouddiag

evidence:
  # score = w_t*temporal + w_r*resource + w_a*anomaly + w_s*semantic + w_d*dependency (each in [0,1]).
  # Weights, detector and threshold were chosen on the dev split only (DECISIONS D55).
  top_k: 10
  window_minutes: 30            # look-back before the alarm; sweeps use window_options
  window_options: [5, 15, 30, 60]
  post_alarm_minutes: 10        # effects and late logs that trail the alarm
  weights:
    temporal: 0.15
    resource: 0.0               # alarmed-resource match; 0 on dev (alarms sit on the symptom side)
    anomaly: 0.3
    semantic: 0.3
    dependency: 0.3
  anomaly_method: zscore        # detector for the anomaly component and the onset estimate
  anomaly_threshold: 6.0        # null = the anomaly section's threshold for that method
  temporal_tau_before_minutes: 5.0
  temporal_tau_after_minutes: 10.0
  max_per_group: 2              # items per metric series / log template / API call; 0 = no cap
  group_member_ratio: 0.9
  event_priors:                 # anomaly component for events without a numeric anomaly
    change: 0.7
    api_error: 0.9
    read_only: 0.0
    error_log: 0.6
    warning_log: 0.3
    info_log: 0.05

correlation:
  # Signals -> links (same resource or impact path, time-ordered) -> chains -> candidate causes.
  max_link_gap_minutes: 10.0
  max_link_hops: 3
  min_anomaly_run_points: 2
  onset_lookback_minutes: 15.0
  max_candidate_causes: 5
  signal_strength: {change: 1.0, api_error: 0.9, anomaly: 0.6, error_log: 0.5, warning_log: 0.3}

diagnosis:
  review_confidence_threshold: 0.6   # below this => requires_human_review
  self_consistency_samples: 5

redaction:
  enabled: true          # applied before ANY external LLM or embedding call (app/ai/redaction.py)
  account_ids: true
  arns: true
  ips: true
  principals: true       # IAM users/roles/sessions, unique ids, access key ids, emails
  secrets: true          # key=value secrets, bearer tokens, JWTs, private keys, URL passwords
  hostnames: true        # *.amazonaws.com / *.compute.internal
  resource_names: false  # canonical ids (rds/db-1c1d) stay readable so citations can be checked
  strict: true           # refuse to send text that still contains a replaced raw value
  bare_secret_keys: true # bare 40-char AWS-secret-key-like strings
  custom_patterns: []    # e.g. - {name: TICKET, pattern: 'TCK-\d{4,}'}
                         #      - {name: LICENSE, pattern: 'license_key=(?P<value>\S+)', secret: true}

llm:
  provider: stub            # stub (LOCAL-ONLY) | openai_compatible | gemini
  model: stub-deterministic
  base_url: null
  # API keys come from env only (CLOUDDIAG_LLM__API_KEY); never put them in this file.

embeddings:
  # sentence_transformers needs `pip install -e ".[embeddings]"`; hashing is LOCAL-ONLY (no
  # download); openai / gemini are external and always pass through redaction.
  provider: sentence_transformers   # sentence_transformers | hashing | openai | gemini
  model: all-MiniLM-L6-v2
  dimension: 384                    # hashing only; other providers report their own
  base_url: null                    # OpenAI-compatible endpoint
  batch_size: 64
  timeout_seconds: 30
  # API keys come from env only (CLOUDDIAG_EMBEDDINGS__API_KEY).

vector_store:
  backend: faiss     # faiss (numpy exact search if faiss-cpu is not installed) | pgvector
  path: null         # directory for the faiss store; null = in memory

rag:
  enabled: true
  corpus_version: historical-v1   # separate corpus: own seed and scenario keys, never test cases
  corpus_seed: 7
  index_name: historical
  candidates: 20                  # nearest neighbours before re-ranking
  top_k: 3
  min_score: 0.0
  rerank: {similarity: 0.7, signals: 0.2, context: 0.1}

anomaly:
  # Statistical detectors only (no LLM). Windows are in minutes, so they adapt to 60 s or 300 s data.
  methods: [zscore, mad, moving_average, rolling_std, isolation_forest]
  baseline_minutes: 30             # trailing window used as the baseline for each point
  min_history_points: 5            # fewer baseline points than this => the point is not scored
  exclude_anomalies_from_baseline: true
  floor_relative: 0.01             # spread floor = max(floor_relative * |median|, floor_absolute);
                                   # only binds on near-flat series (e.g. a constant task count)
  floor_absolute: 1.0e-6
  zscore: {threshold: 3.0}
  mad: {threshold: 3.5}
  moving_average: {threshold: 0.5}
  rolling_std: {threshold: 3.0, recent_points: 3}
  isolation_forest: {threshold: 0.0, train_minutes: 30, min_train_points: 5, n_estimators: 100, random_state: 0}

aws:
  # Credentials: standard AWS chain (env vars, ~/.aws profile, SSO, instance role). Never here.
  region: us-east-1
  profile: null
  max_attempts: 10
  metrics_period_seconds: null       # null = 60 s (<15 d old), 300 s (<63 d), 3600 s (older)
  logs_max_events_per_group: 500
  logs_max_message_chars: 2000
  cloudtrail_requests_per_second: 2.0   # LookupEvents is limited to 2 TPS per account/region
  cloudtrail_ingestion_lag_minutes: 15  # events newer than this may not be queryable yet
  cloudtrail_include_read_only: false
  config_enabled: true                  # AWS Config history is optional (needs a recorder)
  cache_dir: null                       # set a directory to cache collected events on disk
  cache_ttl_seconds: 3600

api:
  api_keys: []   # set via env CLOUDDIAG_API__API_KEYS (JSON list)
