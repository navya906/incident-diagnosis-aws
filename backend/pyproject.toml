[project]
name = "cloud-incident-diagnosis"
version = "0.1.0"
description = "Generative-AI-based AWS cloud incident diagnosis (research system)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "numpy",
  "pandas",
  "scikit-learn",
  "networkx",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx", "ruff"]
aws = ["boto3", "moto[all]"]  # Phase 2 onward

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
